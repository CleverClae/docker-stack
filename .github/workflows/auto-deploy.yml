name: Auto Deploy to Utility01

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.UTILITY01_HOST }}
          username: ${{ secrets.UTILITY01_USER }}
          key: ${{ secrets.UTILITY01_SSH_KEY }}
          script: |
            echo "🔁 Pulling latest stack from GHCR..."
            cd /srv/docker
            docker compose pull
            docker compose up -d
            docker system prune -f
            echo "✅ Deployment complete on Utility01."
